# ===== 認証 =====
auth:
  method: "vertex_ai" # "api_key" | "vertex_ai" | "oauth"
  apiKey: ""
  vertexAi:
    project: "your-project-id"
    location: "us-central1"
  oauth:
    clientId: ""
    clientSecret: ""

# ===== 出力 =====
output:
  directory: ".google-genmedia-mcp/output"

# ===== GCS (Vertex AI 方式のみ) =====
# Veo 動画生成には enabled: true を推奨（output_gcs_uri として使用）
gcs:
  enabled: false
  bucket: "your-bucket-name"

# ===== サーバー =====
server:
  transport: "stdio"
  host: "127.0.0.1"
  port: 8000
  logLevel: "INFO"

# ===== プロンプト =====
prompt:
  prefix: ""        # 全プロンプトの先頭に付与するテキスト（例: "日本語で出力。"）
  separator: "\n"   # prefix とプロンプトの区切り文字

# ===== ツール設定 =====
tools:
  generateImage:
    aspectRatio: "16:9"
    defaultModel: "Nano Banana 2"
    models:
      - id: "gemini-3.1-flash-image"
        aliases: ["Nano Banana 2"]
        global: true  # Vertex AI ではグローバルエンドポイントが必要
      - id: "gemini-3-pro-image"
        aliases: ["Nano Banana Pro"]
        global: true  # Vertex AI ではグローバルエンドポイントが必要
      - id: "gemini-3.1-flash-lite-image"
        aliases: ["Nano Banana 2 Lite", "gemini-3.1-flash-lite"]
        global: true  # Vertex AI ではグローバルエンドポイントが必要
      - id: "gemini-2.5-flash-image"
        aliases: ["Nano Banana", "gemini-2.5-flash-preview-image-generation"]
        # 2026-10-02 に廃止予定。以降は global エンドポイント専用モデルのみ

  generateVideo:
    aspectRatio: "16:9"
    durationSeconds: 8
    numberOfVideos: 1
    generateAudio: null  # null = モデルに応じて自動（Veo 3+ は True、Veo 2 は無効）
    defaultModel: "Veo 3.1"
    models:
      - id: "veo-3.1-generate-001"
        aliases: ["Veo 3.1", "veo-3.1"]
      - id: "veo-3.1-fast-generate-001"
        aliases: ["Veo 3.1 Fast", "veo-3.1-fast"]
      - id: "veo-3.1-lite-generate-001"
        aliases: ["Veo 3.1 Lite", "veo-3.1-lite"]
      - id: "veo-3.0-generate-001"
        aliases: ["Veo 3", "veo-3.0"]
      - id: "veo-3.0-fast-generate-001"
        aliases: ["Veo 3 Fast", "veo-3.0-fast"]
      - id: "veo-2.0-generate-001"
        aliases: ["Veo 2", "veo-2.0"]
    polling:
      pollInterval: 15
      pollTimeout: 600

  # generateVideo と同じ Veo モデルを使用（T2V / I2V でモデル・ポーリング設定を個別管理可能）
  generateVideoFromImage:
    aspectRatio: "16:9"
    durationSeconds: 8
    generateAudio: null  # null = モデルに応じて自動（Veo 3+ は True、Veo 2 は無効）
    defaultModel: "Veo 3.1"
    models:
      - id: "veo-3.1-generate-001"
        aliases: ["Veo 3.1", "veo-3.1"]
      - id: "veo-3.1-fast-generate-001"
        aliases: ["Veo 3.1 Fast", "veo-3.1-fast"]
      - id: "veo-3.1-lite-generate-001"
        aliases: ["Veo 3.1 Lite", "veo-3.1-lite"]
      - id: "veo-3.0-generate-001"
        aliases: ["Veo 3", "veo-3.0"]
      - id: "veo-3.0-fast-generate-001"
        aliases: ["Veo 3 Fast", "veo-3.0-fast"]
      - id: "veo-2.0-generate-001"
        aliases: ["Veo 2", "veo-2.0"]
    polling:
      pollInterval: 15
      pollTimeout: 600

  generateSpeech:
    audioEncoding: "mp3"
    defaultVoice: "Kore"
